# PSST: privately-branded build of Element X iOS (https://github.com/georgonr/psst-ios).
# All bundle / app group / keychain identifiers are derived from these values in the target.yml files.
settings:
  APP_DISPLAY_NAME: psst
  PRODUCTION_APP_NAME: psst
  APP_GROUP_IDENTIFIER: group.eu.macet.psst
  BASE_BUNDLE_IDENTIFIER: eu.macet.psst
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "colors/accent-color"
  # PSST: no team is committed. Signed builds pass DEVELOPMENT_TEAM=<APPLE_TEAM_ID> to xcodebuild
  # (see .github/workflows/ios-release.yml in georgonr/psst). Simulator builds run unsigned.
  DEVELOPMENT_TEAM: ""
  IS_NIGHTLY_BUILD: false

  # PSST: Element Classic account migration removed (CLASSIC_APP_* settings). psst has no legacy app,
  # and the im.vector app group / keychain group would make provisioning impossible.
